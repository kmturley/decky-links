name: release

# Builds the plugin zip the same way .vscode/build.sh does locally — pnpm for
# the frontend, then a linux/amd64 Docker container to vendor Python deps,
# because the Deck needs Linux x86_64 wheels regardless of what built them.
# See .vscode/build.sh for why that matters.
#
# ubuntu-latest is already linux/amd64 and its runner user can use the Docker
# socket without sudo, same as the "wheels" job in test.yml.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: build and publish release
    runs-on: ubuntu-latest
    env:
      # The only target today — the Deck (and other Decky Loader handhelds)
      # is linux/amd64, matching the --platform flag .vscode/build.sh passes
      # to Docker. A future arm64/other-OS build would add a matrix and
      # parameterize both this and that --platform flag together.
      TARGET_OS: linux
      TARGET_ARCH: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like vX.Y.Z (got ${GITHUB_REF#refs/tags/})"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set package.json version to match the tag
        # decky_plugin exposes this to the running plugin as DECKY_PLUGIN_VERSION
        # (plugin.json carries no version field — package.json is the only
        # source of truth). Not committed back; only this build's zip sees it.
        run: npm pkg set version="${{ steps.version.outputs.version }}"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Install Decky CLI
        run: |
          mkdir -p cli
          curl -fL -o cli/decky "https://github.com/SteamDeckHomebrew/cli/releases/latest/download/decky-${TARGET_OS}-${TARGET_ARCH}"
          chmod +x cli/decky

      - name: Build plugin zip
        env:
          DECK_PYTHON: "3.11" # must match what Decky Loader carries — see .vscode/build.sh
        run: ./.vscode/build.sh

      - name: Name artifact with version, OS and arch
        id: artifact
        run: |
          # Named from plugin.json's "name" ("Decky Links"), not a fixed
          # "decky-links.zip" — glob for whatever the CLI actually produced
          # rather than hardcoding a filename that drifted from reality.
          shopt -s nullglob
          built=(out/*.zip)
          if [[ ${#built[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one zip in out/, found: ${built[*]}"
            exit 1
          fi
          name="decky-links-${{ steps.version.outputs.version }}-${TARGET_OS}-${TARGET_ARCH}.zip"
          mv "${built[0]}" "out/$name"
          echo "path=out/$name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.path }}
          generate_release_notes: true
